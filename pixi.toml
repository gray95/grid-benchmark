[workspace]
authors = ["Antonin Portelli <antonin.portelli@ed.ac.uk>", "Ryan Hill <ryan.hill@ed.ac.uk>"]
channels = ["conda-forge"]
name = "grid-benchmark"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[activation.env]
LIBRARY_PATH = "$CONDA_PREFIX/lib"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
INCLUDE = "$CONDA_PREFIX/include"
C_INCLUDE_PATH = "$CONDA_PREFIX/include"
CPLUS_INCLUDE_PATH = "$CONDA_PREFIX/include"

[dependencies]
sqlite = "*"
jq = "*"
autoconf = "*"
automake = "*"
libtool = "*"
cmake = "*"

[feature.apple-silicon]
platforms = ["osx-arm64"]

[feature.apple-silicon.dependencies]
openmpi = "*"
compilers = "*"

[feature.cuda]
system-requirements = { cuda = "12" }
platforms = ["linux-64", "linux-aarch64"]

[feature.rocm]
platforms = ["linux-64", "linux-aarch64"]

[feature.x86]
platforms = ["linux-64"]

[feature.x86.dependencies]
libunwind = "*"

[feature.linux]
platforms = ["linux-64", "linux-aarch64"]

[feature.linux.dependencies]
compilers = "*"
gcc = "12.*"

[feature.llvm20.dependencies]
clang = "20.*"
clangxx = "20.*"
clang-tools = "20.*"
clangdev = "20.*"
libclang = "20.*"
llvm-openmp = "20.*"

[feature.llvm19.dependencies]
clang = "19.*"
clangxx = "19.*"
clang-tools = "19.*"
clangdev = "19.*"
libclang = "19.*"
llvm-openmp = "19.*"

# Fujitsu A64FX (Fugaku): the Grid dependencies for the compute nodes are installed from
# the x86 login node (packages are only extracted there), and an x86 clang cross-compiles
# against them (see systems/fugaku)
[feature.a64fx]
platforms = ["linux-aarch64"]

[feature.a64fx.dependencies]
hdf5 = "1.14.*"
llvm-openmp = "23.*"

[feature.a64fx-toolchain]
platforms = ["linux-64"]

[feature.a64fx-toolchain.dependencies]
clang = "23.*"
clangxx = "23.*"
lld = "23.*"
llvm-tools = "23.*"
sysroot_linux-aarch64 = "2.28.*"
libgcc-devel_linux-aarch64 = "16.*"
libstdcxx-devel_linux-aarch64 = "16.*"

[feature.grid.dependencies]
openssl = "*"
gmp = "*"
mpfr = "*"
hdf5 = "*"
fftw = "*"
zlib = "*"

[environments]
gpu-nvidia = ["default", "grid", "cuda", "linux"]
gpu-nvidia-x86 = ["default", "grid", "cuda", "linux", "x86"]
gpu-amd = ["default", "grid", "rocm", "linux"]
cpu-linux = ["default", "grid", "llvm20", "linux"]
cpu-apple-silicon = ["default", "grid", "llvm19", "apple-silicon"]
cpu-a64fx = { features = ["grid", "a64fx"], no-default-feature = true }
a64fx-toolchain = { features = ["a64fx-toolchain"], no-default-feature = true }
